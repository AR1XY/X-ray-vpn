<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTP VPN — Защищенный доступ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0055ff;
            --disabled-color: #374151;
            --dark-bg: #111827;
            --text-main: #ffffff;
            --text-secondary: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 24px; font-weight: 700; }
        .logo span { color: var(--primary-color); }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 20px;
            background: radial-gradient(circle at center, #1e293b 0%, #111827 100%);
        }

        h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin-bottom: 20px; max-width: 800px; }
        p.description { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 40px; max-width: 600px; }

        .btn-install {
            background-color: var(--disabled-color);
            color: white;
            padding: 18px 50px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            cursor: not-allowed;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .contacts { margin-top: 50px; padding-top: 30px; border-top: 1px solid #1f2937; }
        .contact-link {
            color: var(--text-secondary);
            text-decoration: none;
            margin: 10px;
            display: inline-block;
            font-size: 0.9rem;
        }
        .contact-link:hover { color: var(--primary-color); }

        footer { text-align: center; padding: 20px; color: #4b5563; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">RTP<span>VPN</span></div>
    </header>

    <section class="hero">
        <h1>Скоро здесь будет лучший VPN.</h1>
        <p class="description">Мы работаем над безопасным и быстрым соединением для вас. Подпишитесь, чтобы не пропустить запуск.</p>
        
        <a href="javascript:void(0)" class="btn-install">Установить ZIP (Скоро)</a>

        <div class="contacts">
            <a href="http://t.me/bypassrtp" class="contact-link" target="_blank">📢 Канал: @bypassrtp</a>
            <a href="https://t.me/rtpvpnAdmin" class="contact-link" target="_blank">👨‍💻 Админ: @rtpvpnAdmin</a>
        </div>
    </section>

    <footer>
        &copy; 2026 RTP VPN Project
    </footer>

</body>
          </html>
